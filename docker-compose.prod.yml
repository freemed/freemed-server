services:
  db:
    restart: always
    # Remove public port exposure in production — db is only accessible
    # via the internal Docker network (backend service).
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    restart: always
    # Remove public port exposure in production — redis is only accessible
    # via the internal Docker network (backend service).
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    restart: always
    environment:
      # Required, with no default. The backend refuses to start with a weak or
      # default signing key (it signs every JWT credential domain), so supply it
      # from a .env file or the orchestrator's secret store:
      #   openssl rand -base64 48
      FREEMED_SESSION_KEY: ${FREEMED_SESSION_KEY:?FREEMED_SESSION_KEY must be set to a strong random value, e.g. openssl rand -base64 48}
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
