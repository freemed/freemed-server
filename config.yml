debug: false
database:
  name: freemed
  user: freemed
  pass: freemed
  host: 
  migrations: false
redis:
  host: localhost:6379
  pass:
  dbid:
web:
  port: 3000
  tls-port: 4000
  keys:
    cert:
    key:
paths:
  base-path: .
  db-migrations: db/migrations
  logs: .
session:
  expiry: 10
  # REQUIRED — the server REFUSES TO START without a strong key. It signs every
  # JWT credential domain (staff session, patient portal, SMART/FHIR access
  # tokens), so a weak or public key lets anyone mint an admin token offline.
  # Supply it out-of-band rather than committing it here:
  #   export FREEMED_SESSION_KEY="$(openssl rand -base64 48)"
  # Must be >= 32 bytes and must not be the built-in default.
  key: ""
scheduler:
  start: 9
  end: 16
  interval: 15
