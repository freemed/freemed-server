server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # === Security headers ===
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # === Gzip compression ===
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # === SvelteKit SPA fallback ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Proxy portal API requests to Go backend ===
    location /portal/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === HTML files: no-cache to ensure users always get the latest version ===
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # === Cache static assets ===
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
